[build]
  publish = "."
  functions = "netlify/functions"

# HTML pages (index.html, admin.html) should always be revalidated —
# only the versioned ?v= sub-resources (app.jsx, styles.css, admin.css)
# rely on long caching. Without this, Netlify's CDN caches .html files
# for 10 minutes too, so a fresh deploy can appear "stuck" on old markup.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
