<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול קודי גישה</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=7" />
  <link rel="stylesheet" href="admin.css?v=3" />
</head>
<body>
  <div id="admin-root">
    <div id="admin-login" class="admin-card">
      <h1>ניהול קודי גישה</h1>
      <input id="admin-password" type="password" placeholder="סיסמת ניהול" autocomplete="off" />
      <button id="admin-login-btn">כניסה</button>
      <p id="admin-login-error" class="gate-error"></p>
    </div>

    <div id="admin-panel" class="admin-card" hidden>
      <h1>קודי גישה</h1>
      <form id="admin-add-form" class="admin-add-form">
        <input id="admin-name-input" type="text" placeholder="שם הקונה" required />
        <input id="admin-email-input" type="email" placeholder="אימייל" required />
        <input id="admin-phone-input" type="tel" placeholder="טלפון" />
        <button type="submit">הוסף קונה חדש</button>
      </form>
      <p id="admin-new-code" class="admin-new-code"></p>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>שם</th><th>אימייל</th><th>טלפון</th><th>קוד</th><th>תאריך הרשמה</th><th>סטטוס</th><th>מכשירים</th><th></th></tr>
          </thead>
          <tbody id="admin-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
</body>
</html>
